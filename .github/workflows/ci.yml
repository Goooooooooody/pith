name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile (syntax on this Python)
        run: |
          python -m compileall -q src
          python -m py_compile bin/pith
      - name: Install and run as a package
        run: |
          python -m pip install .
          pith --version
          python -c "print('ERROR boom')" | pith --level error

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate plugin and marketplace manifests
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool hooks/hooks.json > /dev/null
          test -x bin/pith
          npx -y @anthropic-ai/claude-code plugin validate .
